<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
<title id="t">A rectangular pan limit versus the hand-drawn boundary of the Adriatic Sea</title>
<desc id="d">Left: the sea's bounding rectangle, with the land inside it hatched. Right: the hand-drawn polygon that the game actually enforces.</desc>
<style>
text{font-family:Overpass,"Segoe UI",Arial,sans-serif;fill:#14222E}
.h{font-size:17px;font-weight:700} .s{font-size:14px;fill:#465662}
</style>
<defs>
<pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="9" stroke="#D6485A" stroke-width="2" opacity=".55"/></pattern>
</defs>
<rect width="900" height="470" rx="6" fill="#F7F9F8"/>
<text class="h" x="225" y="32" text-anchor="middle">A rectangular limit</text>
<text class="s" x="225" y="52" text-anchor="middle">what a map library offers</text>
<text class="h" x="675" y="32" text-anchor="middle">The drawn boundary</text>
<text class="s" x="675" y="52" text-anchor="middle">what the game enforces</text>
<line x1="450.0" y1="70" x2="450.0" y2="440" stroke="#14222E" stroke-opacity=".15"/>
