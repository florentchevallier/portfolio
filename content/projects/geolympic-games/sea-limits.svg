<rect x="43.1" y="64.0" width="363.9" height="372.0" fill="none" stroke="#14222E" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M128.2 64.0 L232.6 182.1 L395.3 310.6 L406.9 426.8 L340.2 436.0 L308.3 395.6 L183.3 319.8 L73.1 192.5 L43.1 94.6 L128.2 64.0 Z" fill="#BFDDEE" stroke="#2C7CA5" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M578.2 64.0 L682.6 182.1 L845.3 310.6 L856.9 426.8 L790.2 436.0 L758.3 395.6 L633.3 319.8 L523.1 192.5 L493.1 94.6 L578.2 64.0 Z" fill="#BFDDEE" stroke="#2C7CA5" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="578.2" cy="64.0" r="4.5" fill="#fff" stroke="#14222E" stroke-width="2"/>
<circle cx="682.6" cy="182.1" r="4.5" fill="#fff" stroke="#14222E" stroke-width="2"/>
<circle cx="845.3" cy="310.6" r="4.5" fill="#fff" stroke="#14222E" stroke-width="2"/>
<circle cx="856.9" cy="426.8" r="4.5" fill="#fff" stroke="#14222E" stroke-width="2"/>
<circle cx="790.2" cy="436.0" r="4.5" fill="#fff" stroke="#14222E" stroke-width="2"/>
<circle cx="758.3" cy="395.6" r="4.5" fill="#fff" stroke="#14222E" stroke-width="2"/>
<circle cx="633.3" cy="319.8" r="4.5" fill="#fff" stroke="#14222E" stroke-width="2"/>
<circle cx="523.1" cy="192.5" r="4.5" fill="#fff" stroke="#14222E" stroke-width="2"/>
<circle cx="493.1" cy="94.6" r="4.5" fill="#fff" stroke="#14222E" stroke-width="2"/>
<text class="s" x="675" y="456" text-anchor="middle">9 vertices drawn by hand in QGIS</text>
<text class="s" x="225" y="456" text-anchor="middle">hatched: reachable, but not sea</text>
