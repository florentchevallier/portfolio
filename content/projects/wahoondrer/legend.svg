<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
<title id="t">What the extra layers look like</title>
<desc id="d">Legend of the symbols added to the map: unvisited roads in orange, unpaved ones dashed, achievement boundaries in subtle violet dashes, unexplored big Squadrats squares as a solid red outline, small ones dashed red, and toilet icons in green when free, red when paid and blue when unknown.</desc>
<style>
text{font-family:Overpass,"Segoe UI",Arial,sans-serif;fill:#14222E}
.h{font-size:16px;font-weight:700}
.t{font-size:15px}
.s{font-size:13px;fill:#465662}
</style>
<rect width="960" height="300" rx="6" fill="#F7F9F8"/>
<text class="h" x="30" y="36">Added to the normal map</text>
<line x1="30" y1="72" x2="150" y2="72" stroke="#E8731A" stroke-width="5" stroke-linecap="round"/>
<text class="t" x="170" y="77">Road not yet travelled (Wandrer)</text>
<line x1="30" y1="112" x2="150" y2="112" stroke="#E8731A" stroke-width="5" stroke-dasharray="14 9"/>
<text class="t" x="170" y="117">Not travelled and unpaved</text>
<line x1="30" y1="152" x2="150" y2="152" stroke="#8E6BC7" stroke-width="2" stroke-dasharray="3 12"/>
<text class="t" x="170" y="157">Achievement boundary (kept subtle on purpose)</text>
<line x1="30" y1="192" x2="150" y2="192" stroke="#E03030" stroke-width="3.5"/>
<text class="t" x="170" y="197">Unexplored big Squadrats square (zoom 14)</text>
<line x1="30" y1="232" x2="150" y2="232" stroke="#E03030" stroke-width="3" stroke-dasharray="9 9"/>
<text class="t" x="170" y="237">Unexplored small Squadratinho (zoom 17)</text>
<text class="s" x="30" y="276">Drawn for this page from the style rules, not captured from a device.</text>
<text class="h" x="640" y="36">POIs with variants</text>
<circle cx="660" cy="72" r="11" fill="#1A9C3A"/><text class="t" x="684" y="77">Toilets, free</text>
<circle cx="660" cy="112" r="11" fill="#D32F2F"/><text class="t" x="684" y="117">Toilets, paid</text>
<circle cx="660" cy="152" r="11" fill="#1E63D8"/><text class="t" x="684" y="157">Toilets, no fee information</text>
<text class="s" x="640" y="192">Customer-only and private ones are hidden.</text>
</svg>
